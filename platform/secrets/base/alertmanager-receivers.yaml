# Alertmanager receiver credentials. The same manifest works on every cluster:
# only the ClusterSecretStore named platform-secrets differs per cloud.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-receivers
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: alertmanager-receivers
    creationPolicy: Owner
  data:
    - secretKey: pagerduty-routing-key
      remoteRef:
        key: cpb/alertmanager-receivers
        property: pagerduty-routing-key
    - secretKey: slack-webhook-url
      remoteRef:
        key: cpb/alertmanager-receivers
        property: slack-webhook-url
