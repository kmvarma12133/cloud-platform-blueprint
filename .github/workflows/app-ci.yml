name: app-ci

# Test, build, scan and SBOM on every PR and push to main. On main only, the
# scanned image is pushed to GHCR, signed with keyless Cosign, given an SBOM
# attestation, and promoted to dev by committing its tag to values-dev.yaml.
on:
  pull_request:
    paths:
      - app/**
      - .github/workflows/app-ci.yml
  push:
    branches: [main]
    paths:
      - app/**
      - .github/workflows/app-ci.yml

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: app-ci-${{ github.ref }}
  # Superseded PR runs are cancelled; main runs queue so a publish is never cut short.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check --output-format=github .
          ruff format --check .
      - name: Test
        run: pytest --cov=orders_api --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: app/coverage.xml
          retention-days: 14

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # GHCR paths must be lowercase; github.repository_owner keeps the account's case.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${OWNER,,}/orders-api" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built once and handed to the later jobs as a tarball, so the bytes that
      # are scanned are exactly the bytes that get pushed and signed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          build-args: VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/orders-api.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The SBOM is produced with Syft and attached with Cosign below.
          provenance: false
          sbom: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/orders-api.tar
          retention-days: 1

  scan:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      # GHCR paths must be lowercase; github.repository_owner keeps the account's case.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${OWNER,,}/orders-api" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/orders-api.tar"

      # Full report (all severities) for the Security tab...
      - name: Trivy (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      # ...and the gate: fail on CRITICAL or HIGH that already has a fix.
      - name: Trivy (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-setup-trivy: true

      - name: SBOM (Syft, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # OIDC token for keyless Cosign (Fulcio + Rekor)
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      # GHCR paths must be lowercase; github.repository_owner keeps the account's case.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${OWNER,,}/orders-api" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        env:
          REF: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          docker load --input "$RUNNER_TEMP/orders-api.tar"
          docker push "$REF"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$REF" | cut -d@ -f2)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $REF@$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # Keyless: the certificate binds the signature to this workflow, repo and
      # ref through the job's OIDC token. There is no private key to leak.
      - name: Sign and attest
        env:
          DIGEST_REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$DIGEST_REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$DIGEST_REF"

  promote-dev:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write # commit the new tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitOps promotion: Argo CD notices the commit and runs the canary in dev.
      # tag@digest keeps a readable tag while the kubelet pulls by digest.
      - name: Point values-dev.yaml at the new image
        env:
          TAG: ${{ github.sha }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          file=platform/charts/orders-api/values-dev.yaml
          sed -i -E "s|^(  tag: ).*|\1\"${TAG}@${DIGEST}\"|" "$file"
          git diff --exit-code --quiet "$file" && { echo "No change"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): promote orders-api ${TAG::7} to dev"
          # Another merge may have landed meanwhile; replay on top of it.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
