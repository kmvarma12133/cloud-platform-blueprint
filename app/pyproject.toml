[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S104"]  # binding 0.0.0.0 is expected inside a container

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
