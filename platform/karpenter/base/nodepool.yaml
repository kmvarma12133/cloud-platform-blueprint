apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        node-role: workload
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        # Karpenter picks the cheapest offering that fits and prefers spot when
        # both are allowed; on-demand is the fallback when spot is unavailable.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        # Compute, general purpose and memory optimised. A wide pool of shapes
        # is what makes spot reliable: more pools mean fewer interruptions.
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
        # The image is built for amd64 only (see .github/workflows/app-ci.yml).
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
      # Nodes are replaced at least every 30 days, which picks up new AMIs and
      # keeps long-lived configuration drift from accumulating.
      expireAfter: 720h

  disruption:
    # Remove empty nodes and repack under-used ones onto fewer, cheaper nodes.
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets:
      # Never disrupt more than 10% of nodes at once.
      - nodes: "10%"

  # Hard ceiling on what this pool can provision, as a guard against runaway
  # scaling (and runaway bills). Set per environment by the overlays.
  limits:
    cpu: "64"
    memory: 256Gi
