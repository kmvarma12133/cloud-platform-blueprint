# Upstream chart, values from this repo (multi-source: the second source is
# only referenced as $values).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.11.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/platform/observability/values/kube-prometheus-stack.yaml
        # CRDs come from the prometheus-operator-crds Application (wave -15),
        # so every add-on can ship a ServiceMonitor before this one is healthy.
        valuesObject:
          crds:
            enabled: false
    - repoURL: https://github.com/Kmvarma12133/cloud-platform-blueprint.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
