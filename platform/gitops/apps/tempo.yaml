# Upstream chart, values from this repo (multi-source: the second source is
# only referenced as $values).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: tempo
      targetRevision: 3.2.0
      helm:
        releaseName: tempo
        valueFiles:
          - $values/platform/observability/values/tempo.yaml
    - repoURL: https://github.com/OWNER/cloud-platform-blueprint.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
