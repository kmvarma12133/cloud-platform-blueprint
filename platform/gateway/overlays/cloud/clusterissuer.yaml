# Let's Encrypt via HTTP-01, answered through the same Gateway. cert-manager's
# Gateway API support (enabled in its Argo CD Application) watches Gateway
# listeners annotated with this issuer and keeps their certificates renewed.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform-team@example.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: public
                namespace: envoy-gateway-system
                kind: Gateway
