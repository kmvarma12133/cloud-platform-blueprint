# AWS Secrets Manager. No credentials here: the operator authenticates with the
# Pod Identity role from infra/modules/aws-eks/external-secrets.tf, which can
# read only secrets under cpb/.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
