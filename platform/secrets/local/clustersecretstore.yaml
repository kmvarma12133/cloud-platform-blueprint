# kind has no cloud secret manager. ESO's fake provider serves placeholder
# values so the same ExternalSecret and Alertmanager config work unchanged.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-secrets
spec:
  provider:
    fake:
      data:
        - key: cpb/alertmanager-receivers
          value: '{"pagerduty-routing-key": "local-placeholder", "slack-webhook-url": "http://localhost:9/discard"}'
