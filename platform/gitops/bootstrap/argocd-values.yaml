# Values for the argo-cd Helm chart (argo/argo-cd 10.10.5, Argo CD v3.5.5),
# used by scripts/local-up.sh and for the initial install on a cloud cluster.
# After that, Argo CD can manage its own release like any other add-on.

configs:
  cm:
    # Argo CD stopped assessing the health of Application resources by default
    # in 1.8. Without this check, sync waves between child Applications in an
    # app-of-apps do not wait for each other: wave 0 would start while the
    # CRDs from wave -15 are still being installed.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
    # Track resources by annotation rather than by the instance label, which
    # Helm charts sometimes set themselves.
    application.resourceTrackingMethod: annotation

# No SSO or notifications in this reference setup.
dex:
  enabled: false
notifications:
  enabled: false
