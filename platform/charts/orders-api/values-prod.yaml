# prod: synced manually after review. Only the promote-prod workflow changes
# image.tag, and only to a digest-verified, signed image already running in dev.
image:
  tag: "0.1.0"

environment: prod
logLevel: INFO

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

rollout:
  analysis:
    # More samples before each promotion step in prod.
    count: 6

autoscaling:
  minReplicas: 3
  maxReplicas: 20

pdb:
  maxUnavailable: 1

httpRoute:
  enabled: true
  hostnames:
    - orders.example.com
