# EKS prod cluster (cpb-prod). This cluster's root Application points here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps
  - ../../aws
patches:
  # Only the prod element of the orders-api list generator.
  - target:
      kind: ApplicationSet
      name: orders-api
    patch: |-
      - op: add
        path: /spec/generators/0/selector
        value:
          matchLabels:
            env: prod
  - target:
      kind: Application
      name: karpenter
    patch: |-
      - op: replace
        path: /spec/source/helm/valuesObject/settings
        value:
          clusterName: cpb-prod
          interruptionQueue: cpb-prod-karpenter
  - target:
      kind: Application
      name: karpenter-nodepools
    patch: |-
      - op: replace
        path: /spec/source/path
        value: platform/karpenter/overlays/prod
  - target:
      kind: Application
      name: platform-policies
    patch: |-
      - op: replace
        path: /spec/source/path
        value: platform/policies/gatekeeper/constraints/prod
  - target:
      kind: Application
      name: platform-gateway
    patch: |-
      - op: replace
        path: /spec/source/path
        value: platform/gateway/overlays/prod
  - target:
      kind: Application
      name: kubecost
    patch: |-
      - op: replace
        path: /spec/source/helm/valuesObject/global/clusterId
        value: cpb-prod
  # Prod: nothing syncs on its own. Argo CD shows the diff and a person syncs it.
  - target:
      group: argoproj.io
      kind: Application
    patch: |-
      - op: remove
        path: /spec/syncPolicy/automated
