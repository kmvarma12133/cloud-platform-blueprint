apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # Argo CD stopped assessing the health of Application resources by default
  # in 1.8. Without this check, sync waves between child Applications in an
  # app-of-apps do not wait for each other: wave 0 would start while the CRDs
  # from wave -15 are still being installed.
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
