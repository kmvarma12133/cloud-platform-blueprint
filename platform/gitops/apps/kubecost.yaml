apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubecost
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  source:
    # Kubecost 3 (the cost-analyzer 2.x chart is now only an upgrade bridge).
    # It collects allocation data with its own FinOps agent, so it no longer
    # needs a Prometheus of its own or access to the cluster one.
    repoURL: https://kubecost.github.io/kubecost
    chart: kubecost
    targetRevision: 3.3.1
    helm:
      releaseName: kubecost
      valuesObject:
        global:
          # Names this cluster in cost reports. Set per cluster by ../clusters/*.
          clusterId: cpb
  destination:
    server: https://kubernetes.default.svc
    namespace: kubecost
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
