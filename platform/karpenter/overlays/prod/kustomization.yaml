apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: EC2NodeClass
      name: default
    patch: |-
      - op: replace
        path: /spec/role
        value: cpb-prod-karpenter-node
      - op: replace
        path: /spec/subnetSelectorTerms/0/tags/karpenter.sh~1discovery
        value: cpb-prod
      - op: replace
        path: /spec/securityGroupSelectorTerms/0/tags/karpenter.sh~1discovery
        value: cpb-prod
  - target:
      kind: NodePool
      name: default
    patch: |-
      - op: replace
        path: /spec/limits/cpu
        value: "256"
      - op: replace
        path: /spec/limits/memory
        value: 1024Gi
