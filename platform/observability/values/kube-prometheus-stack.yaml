# kube-prometheus-stack: Prometheus Operator, Prometheus, Alertmanager, Grafana,
# kube-state-metrics and node-exporter.

# Gives services the predictable names other components point at, e.g.
# http://kube-prometheus-stack-prometheus.monitoring:9090 for Argo Rollouts
# analysis and KEDA.
fullnameOverride: kube-prometheus-stack

prometheus:
  prometheusSpec:
    # Select every ServiceMonitor, PodMonitor and PrometheusRule in the cluster,
    # not only those carrying this chart's release label, so application teams
    # can ship their own alongside their workloads.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # The SLO rules look back 30 days; keep at least that much.
    retention: 31d
    retentionSize: 45GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 4Gi

grafana:
  # Dashboards come from ConfigMaps labelled grafana_dashboard: "1" in any namespace.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  additionalDataSources:
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.observability:3200
      access: proxy
      jsonData:
        # Jump from a trace to the matching request metrics.
        tracesToMetrics:
          datasourceUid: prometheus
        serviceMap:
          datasourceUid: prometheus

alertmanager:
  alertmanagerSpec:
    # Receiver credentials are mounted from a Secret synced by External Secrets
    # (platform/gitops/manifests/alertmanager-receivers.yaml), never stored in Git.
    secrets:
      - alertmanager-receivers
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: ticket
      group_by: ["alertname", "namespace", "slo"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Pages wake someone up: fast-burning SLOs and anything else marked page.
        - matchers: ['severity="page"']
          receiver: page
          repeat_interval: 1h
        # Tickets go to the team queue and are handled in working hours.
        - matchers: ['severity="ticket"']
          receiver: ticket
        # Always-firing heartbeat from kube-prometheus-stack; proves the
        # pipeline works end to end without paging anyone.
        - matchers: ['alertname="Watchdog"']
          receiver: blackhole
        - matchers: ['alertname="InfoInhibitor"']
          receiver: blackhole
    inhibit_rules:
      # A fast burn is also a slow burn. While the page is firing, suppress the
      # matching ticket so on-call gets one notification, not two.
      - source_matchers: ['severity="page"']
        target_matchers: ['severity="ticket"']
        equal: ["alertname", "namespace", "slo"]
    receivers:
      - name: page
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/alertmanager-receivers/pagerduty-routing-key
            description: '{{ .CommonAnnotations.summary }}'
            # PagerDuty shows these as links on the incident.
            links:
              - href: '{{ .CommonAnnotations.runbook_url }}'
                text: Runbook
            details:
              runbook: '{{ .CommonAnnotations.runbook_url }}'
              namespace: '{{ .CommonLabels.namespace }}'
      - name: ticket
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-receivers/slack-webhook-url
            channel: "#team-orders-alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
            text: |-
              {{ range .Alerts }}{{ .Annotations.description }}
              Runbook: {{ .Annotations.runbook_url }}
              {{ end }}
      - name: blackhole
