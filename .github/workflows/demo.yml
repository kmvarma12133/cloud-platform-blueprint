name: demo

# Runs the local demo end to end on a GitHub runner and records it: a kind
# cluster, Argo CD syncing this repo from GitHub, then `make demo-rollback`
# captured with asciinema and rendered to a GIF with agg. Manual only, as it
# takes about 20 minutes; the GIF is uploaded as an artifact.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  record:
    name: kind demo, recorded
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      AGG_VERSION: v1.9.0
      AGG_SHA256: f111e315cd71056b116302342553dd765b7297579ed511f111d0cedb442aeda6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kind, asciinema and agg
        run: |
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum --check
          sudo install kind /usr/local/bin/kind
          curl -fsSLo agg "https://github.com/asciinema/agg/releases/download/${AGG_VERSION}/agg-x86_64-unknown-linux-gnu"
          echo "${AGG_SHA256}  agg" | sha256sum --check
          sudo install agg /usr/local/bin/agg
          sudo apt-get update -q
          sudo apt-get install -y -q asciinema
      # local-lite has everything the canary analysis needs and starts faster.
      - name: Bring up the platform on kind
        env:
          LOCAL_PROFILE: local-lite
        run: make local-up
      - name: Record make demo-rollback
        run: |
          asciinema rec --quiet --overwrite --idle-time-limit 2 --cols 110 --rows 32 \
            --command "make demo-rollback" demo-rollback.cast
          # asciinema does not pass the command's exit code through.
          grep -q "Rollout ABORTED by the canary analysis" demo-rollback.cast || {
            echo "::error::the demo did not end with an aborted rollout"
            exit 1
          }
          agg --speed 2 --font-size 16 demo-rollback.cast demo-rollback.gif
      - name: Show the cluster state on failure
        if: failure()
        run: |
          kubectl -n argocd get applications || true
          kubectl -n orders-dev describe rollout orders-api || true
      # Every measurement of every analysis, to see which step caught the canary.
      - name: Save the AnalysisRuns
        if: always()
        run: kubectl -n orders-dev get analysisrun -o yaml > analysisruns.yaml || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: demo-rollback
          path: |
            demo-rollback.cast
            demo-rollback.gif
            analysisruns.yaml
          if-no-files-found: ignore
