apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: platform
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.21.0
    helm:
      releaseName: keda
      valuesObject:
        prometheus:
          operator:
            enabled: true
            serviceMonitor:
              enabled: true
          metricServer:
            enabled: true
            serviceMonitor:
              enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
