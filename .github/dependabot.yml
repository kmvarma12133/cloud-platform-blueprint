# Weekly update PRs for every pinned dependency Dependabot understands. Helm
# chart versions in Argo CD Applications are bumped by hand (see README).
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/app", "/scripts"]
    schedule:
      interval: weekly
      day: monday
    groups:
      opentelemetry:
        patterns: ["opentelemetry-*"]

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
      day: monday

  # Also updates the SHA pins and the version comments next to them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /infra/modules/aws-vpc
      - /infra/modules/aws-eks
      - /infra/modules/azure-aks
      - /infra/bootstrap
    schedule:
      interval: weekly
      day: monday
