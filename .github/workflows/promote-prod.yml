name: promote-prod

# Manual promotion of an image that has already run in dev. The job waits for
# approval on the "production" environment, proves the image was built and
# signed by this repo's app-ci workflow on main, and then opens a PR that pins
# values-prod.yaml to the verified digest. Argo CD syncs prod by hand after merge.
on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: Commit SHA of the image to promote (the tag app-ci pushed)
        required: true
        type: string

permissions: {}

concurrency:
  group: promote-prod
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: production # required reviewers are configured on this environment
    permissions:
      contents: write # push the promotion branch
      pull-requests: write # open the PR
      packages: read # read signatures if the GHCR package is private
    env:
      TAG: ${{ inputs.image-tag }}
      # Only signatures made by app-ci on main are accepted.
      SIGNER: https://github.com/${{ github.repository }}/.github/workflows/app-ci.yml@refs/heads/main
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      # GHCR paths must be lowercase; github.repository_owner keeps the account's case.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${OWNER,,}/orders-api" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      # Inputs are untrusted text: validate before using them anywhere.
      - name: Validate input
        run: |
          [[ "$TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::image-tag must be a full 40-character commit SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the "ran in dev" check

      - name: Image must have been deployed to dev
        run: |
          if [ -z "$(git log --format=%H -S"$TAG" -- platform/charts/orders-api/values-dev.yaml)" ]; then
            echo "::error::$TAG was never promoted to dev; refusing to skip an environment"
            exit 1
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Verify signature and SBOM attestation
        id: verify
        run: |
          cosign verify "$IMAGE:$TAG" \
            --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer "$ISSUER" \
            --output json > verify.json
          digest="$(jq -r '.[0].critical.image."docker-manifest-digest"' verify.json)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::could not read a digest from the signature"; exit 1; }
          cosign verify-attestation "$IMAGE@$digest" \
            --type spdxjson \
            --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer "$ISSUER" > /dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Verified $IMAGE:$TAG"
            echo "- digest: \`$digest\`"
            echo "- signer: \`$SIGNER\`"
            echo "- SBOM attestation: present and signed by the same identity"
          } >> "$GITHUB_STEP_SUMMARY"

      # tag@digest: the kubelet pulls exactly the bytes that were verified above.
      - name: Pin values-prod.yaml
        env:
          DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          sed -i -E "s|^(  tag: ).*|\1\"${TAG}@${DIGEST}\"|" platform/charts/orders-api/values-prod.yaml
          git diff --stat

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: promote/orders-api-prod-${{ inputs.image-tag }}
          commit-message: "chore(deploy): promote orders-api ${{ inputs.image-tag }} to prod"
          title: "Promote orders-api to prod (${{ inputs.image-tag }})"
          body: |
            Promotes `${{ env.IMAGE }}:${{ inputs.image-tag }}` to prod, pinned to
            `${{ steps.verify.outputs.digest }}`.

            Checked by this workflow before opening the PR:
            - the image ran in dev (it appears in the history of `values-dev.yaml`);
            - its Cosign signature was made by `app-ci.yml` on `main` of this repository;
            - its SPDX SBOM attestation is signed by the same identity.

            After merging, sync `orders-api-prod` in Argo CD. The canary analysis gates each step.
          labels: promotion
          delete-branch: true
