# Azure Key Vault through workload identity: the operator's service account is
# federated with a managed identity that has "Key Vault Secrets User" on this
# vault (see docs/architecture.md). Replace the vault URL with your own.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-secrets
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-cpb-dev.vault.azure.net
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
